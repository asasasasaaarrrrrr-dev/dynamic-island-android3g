<!DOCTYPE html>
<html lang="ru"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,user-scalable=no">
<title>DJI Drone Simulator</title>
<style>
:root{--ink:#f5f7fa;--mut:#a9b4bf;--glass:rgba(10,12,15,.6);--line:rgba(255,255,255,.18);--acc:#fff;--accfg:#0b0d10;--ok:#3ddc84;--s:clamp(110px,26vmin,170px);color-scheme:dark;box-sizing:border-box}
*{box-sizing:border-box}
html,body{height:100%;margin:0;overflow:hidden;background:#c4e0f4;color:var(--ink);font:500 14px/1.3 "Segoe UI",Roboto,system-ui,sans-serif;touch-action:none;user-select:none;-webkit-user-select:none}
canvas#c{position:fixed;inset:0;width:100%;height:100%;display:block}
button{font:inherit;color:var(--ink);background:var(--glass);border:1px solid var(--line);border-radius:8px;padding:7px 11px;backdrop-filter:blur(8px);-webkit-backdrop-filter:blur(8px);cursor:pointer}
.hv{display:none}body.fly .hv{display:block}
#vig{position:fixed;inset:0;pointer-events:none;background:radial-gradient(ellipse at center,transparent 55%,rgba(0,0,0,.38))}
#bar{position:fixed;left:0;right:0;top:0;display:none;align-items:center;justify-content:space-between;gap:8px;padding:calc(env(safe-area-inset-top,0px) + 6px) calc(env(safe-area-inset-right,0px) + 10px) 14px calc(env(safe-area-inset-left,0px) + 10px);background:linear-gradient(rgba(0,0,0,.6),transparent);pointer-events:none}
body.fly #bar{display:flex}#bar>*{pointer-events:auto}
#stt{display:flex;align-items:center;gap:7px;font-weight:600}.dot{width:9px;height:9px;border-radius:50%;background:var(--ok);display:inline-block}
#sys{display:flex;align-items:center;gap:8px;font-variant-numeric:tabular-nums}#sys button{padding:5px 9px;font-size:13px}
#mm{position:fixed;left:calc(env(safe-area-inset-left,0px) + 10px);top:calc(env(safe-area-inset-top,0px) + 46px);width:92px;height:92px;border-radius:50%;border:1px solid var(--line);display:none}
#tele{position:fixed;right:calc(env(safe-area-inset-right,0px) + 12px);top:calc(env(safe-area-inset-top,0px) + 50px);text-align:right;font-variant-numeric:tabular-nums;text-shadow:0 1px 3px rgba(0,0,0,.8);line-height:1.5;display:none}
#tele span{color:var(--mut);margin-right:5px}
#cross{position:fixed;left:50%;top:50%;width:26px;height:26px;margin:-13px;border:1.5px solid rgba(255,255,255,.75);border-radius:50%;display:none;pointer-events:none}
#cross:after{content:"";position:absolute;left:50%;top:50%;width:3px;height:3px;margin:-1.5px;background:#fff;border-radius:50%}
#msg{position:fixed;left:0;right:0;top:calc(env(safe-area-inset-top,0px) + 52px);text-align:center;font-weight:700;color:#ffd24a;text-shadow:0 1px 4px #000;pointer-events:none}
#hint{position:fixed;left:0;right:0;bottom:calc(env(safe-area-inset-bottom,0px) + 12px);text-align:center;color:#fff;text-shadow:0 1px 4px #000;display:none;pointer-events:none;padding:0 12px;font-size:13px}
body.fly:not(.touch) #hint{display:block}
.stick{position:fixed;bottom:calc(env(safe-area-inset-bottom,0px) + 28px);width:var(--s);height:var(--s);border-radius:50%;background:rgba(0,0,0,.3);border:2px solid var(--line);display:none;touch-action:none}
.stick i{position:absolute;left:50%;top:50%;width:40%;height:40%;margin:-20% 0 0 -20%;border-radius:50%;background:rgba(255,255,255,.85)}
#sl{left:calc(env(safe-area-inset-left,0px) + 28px)}#sr{right:calc(env(safe-area-inset-right,0px) + 28px)}
body.touch.fly .stick{display:block}
#menu{position:fixed;inset:0;display:flex;flex-direction:column;justify-content:space-between;padding:calc(env(safe-area-inset-top,0px) + 14px) calc(env(safe-area-inset-right,0px) + 16px) calc(env(safe-area-inset-bottom,0px) + 14px) calc(env(safe-area-inset-left,0px) + 16px);pointer-events:none}
body.fly #menu{display:none}#menu>*{pointer-events:auto}
#ttl{align-self:flex-start;background:var(--glass);border:1px solid var(--line);border-radius:12px;padding:10px 14px;backdrop-filter:blur(8px);-webkit-backdrop-filter:blur(8px)}
#ttl h1{margin:0;font-size:20px;font-weight:700;letter-spacing:.02em}#dev{margin:2px 0 0;color:var(--mut);font-size:12px}
#panel{background:var(--glass);border:1px solid var(--line);border-radius:14px;padding:12px;max-width:760px;width:100%;margin:0 auto;backdrop-filter:blur(10px);-webkit-backdrop-filter:blur(10px)}
#chips{display:flex;gap:8px;overflow-x:auto;touch-action:pan-x;padding-bottom:8px;scrollbar-width:none}#chips::-webkit-scrollbar{display:none}
#chips button{flex:0 0 auto;white-space:nowrap}#chips button.on{background:var(--acc);color:var(--accfg);border-color:var(--acc);font-weight:700}
#info{margin:4px 2px 10px}#ctl{margin:10px 2px 0;color:var(--mut);font-size:12px}
#go{width:100%;background:var(--acc);color:var(--accfg);border-color:var(--acc);font-weight:700;font-size:17px;padding:13px;border-radius:10px}
#crash{position:fixed;inset:0;display:none;flex-direction:column;align-items:center;justify-content:center;gap:10px;background:rgba(0,20,40,.6);font-size:24px;z-index:5;text-align:center}
#crash span{font-size:15px;color:var(--mut)}#crash button{background:#fff;color:#0b0d10;font-weight:700;padding:12px 22px;font-size:16px}
body.gog #mm,body.gog #cross,body.gog #vig{display:none!important}body.gog #tele,body.gog #bar{font-family:ui-monospace,Menlo,monospace;text-transform:uppercase}
#fade{position:fixed;inset:0;background:#000;opacity:0;pointer-events:none;transition:opacity .35s;z-index:4}body.pre #cross,body.pre #vig{display:none!important}
#chips{position:relative;gap:10px;padding:2px 2px 10px}
#chips button{width:128px;padding:6px 6px 8px;text-align:left;white-space:normal;background:linear-gradient(160deg,rgba(255,255,255,.1),rgba(255,255,255,.03));border-radius:12px}
#chips button img{width:100%;height:78px;object-fit:contain;display:block}
#chips button b{display:block;font-size:13px;margin-top:2px}#chips button small{color:var(--mut);font-size:11px}
#chips button.on{background:rgba(255,255,255,.16);color:var(--ink);border-color:#fff;box-shadow:0 0 0 1px #fff inset}
#spec .sh{display:flex;align-items:baseline;gap:8px;margin:2px 2px 8px}#spec .sh b{font-size:20px}
#spec .sh em{font-style:normal;font-size:11px;border:1px solid var(--line);border-radius:20px;padding:1px 8px;color:var(--mut)}
#spec .sg{display:grid;grid-template-columns:repeat(4,1fr);gap:6px}#spec .sg div{background:rgba(255,255,255,.07);border-radius:10px;padding:7px 8px;font-size:13px;font-weight:600}
#spec small{display:block;color:var(--mut);font-weight:500;font-size:11px;margin-bottom:2px}#spec .sm{margin:8px 2px 10px;color:var(--mut);font-size:12px}
@media (max-width:560px){#spec .sg{grid-template-columns:repeat(2,1fr)}#chips button{width:108px}#chips button img{height:62px}}
@media (max-height:480px){#ctl,#spec .sm{display:none}#chips button{width:96px}#chips button img{height:50px}#spec .sg{grid-template-columns:repeat(4,1fr)}#go{padding:10px}}
@keyframes dropIn{from{opacity:0;transform:translateY(-24px)}}
@keyframes riseIn{from{opacity:0;transform:translateY(60px)}}
@keyframes cardIn{from{opacity:0;transform:translateY(34px) scale(.88)}}
@keyframes fadeUp{from{opacity:0;transform:translateY(10px)}}
@keyframes glow{0%,100%{box-shadow:0 0 0 1px #fff inset,0 0 0 rgba(80,180,255,0)}50%{box-shadow:0 0 0 1px #fff inset,0 0 22px rgba(80,180,255,.5)}}
@keyframes bob{0%,100%{transform:translateY(0)}50%{transform:translateY(-4px)}}
@keyframes imgPop{0%{transform:scale(.7) rotate(-6deg)}60%{transform:scale(1.12) rotate(2deg)}100%{transform:none}}
@keyframes shine{from{left:-60%}to{left:140%}}
@keyframes pulse{0%{box-shadow:0 0 0 0 rgba(255,255,255,.45)}70%,100%{box-shadow:0 0 0 14px rgba(255,255,255,0)}}
@keyframes drift{to{transform:translate(-3%,2%) scale(1.1)}}
#aur{position:fixed;inset:-10%;pointer-events:none;background:radial-gradient(40vmax 30vmax at 20% 80%,rgba(53,176,255,.24),transparent 60%),radial-gradient(35vmax 28vmax at 85% 70%,rgba(255,160,90,.17),transparent 60%);animation:drift 14s ease-in-out infinite alternate}
body.fly #aur{display:none}
#panel,#ttl{transition:transform .4s cubic-bezier(.6,0,.9,.4),opacity .4s}
#menu.out #panel{transform:translateY(120%);opacity:0}#menu.out #ttl{transform:translateY(-140%);opacity:0}
#menu.in #ttl{animation:dropIn .6s cubic-bezier(.2,.8,.2,1) backwards}

#chips button{transition:transform .25s cubic-bezier(.2,.9,.3,1.3),background .25s,border-color .25s}
#chips button:hover{transform:translateY(-4px)}#chips button:active{transform:scale(.96)}
#chips button.on{animation:glow 2.4s ease-in-out infinite}
#chips button.on img{animation:imgPop .5s cubic-bezier(.2,1.4,.4,1),bob 3s .5s ease-in-out infinite}
#spec .sh,#spec .sm,#spec .sg div{animation:fadeUp .45s backwards}
#spec .sg div:nth-child(2){animation-delay:.05s}#spec .sg div:nth-child(3){animation-delay:.1s}#spec .sg div:nth-child(4){animation-delay:.15s}
#go{position:relative;overflow:hidden;transition:transform .15s;animation:pulse 2.6s infinite}

@media (prefers-reduced-motion:reduce){*{animation:none!important}}

#hz{display:flex;justify-content:space-between;font-size:.8em}
#ret{position:absolute;left:50%;top:50%;width:2.2em;height:2.2em;margin:-1.1em}

#ret:before{left:-1.8em}#ret:after{right:-1.8em}
#osdl{position:absolute;left:4.5%;bottom:9%}#osdr{position:absolute;right:4.5%;bottom:9%;text-align:right}
body.touch #osdl,body.touch #osdr{bottom:calc(var(--s) + 48px)}
#o_r{position:absolute;right:4.5%;top:13%}
#bi{display:inline-block;width:.7em;height:1.15em;border:2px solid #fff;border-radius:2px;position:relative;vertical-align:-.15em;margin-right:.5em}

#bl1,#bl2,#bl3{position:absolute;background:#14161a;filter:blur(1.4px);opacity:.93;animation:vib .07s infinite alternate}

#bl2{right:-3%;top:41%;width:38%;height:8%;clip-path:polygon(100% 0,0 45%,0 55%,100% 100%)}
@keyframes vib{from{transform:translateY(-1.5px)}to{transform:translateY(1.5px)}}
#chp{position:fixed;left:calc(env(safe-area-inset-left,0px) + 10px);top:calc(env(safe-area-inset-top,0px) + 46px);display:none;gap:8px;align-items:center;pointer-events:none;font-weight:700;text-shadow:0 1px 3px #000}
body.cheap #chp{display:flex}body.cheap #mm,body.cheap #cross{display:none!important}body.cheap #sys>span:nth-child(2){visibility:hidden}
.k8{background:#ffd400;color:#000;font-weight:900;padding:1px 9px;border-radius:4px;font-style:italic;font-size:18px;text-shadow:none}
#gogs{position:fixed;inset:0;background:#000;opacity:0;pointer-events:none;transition:opacity .5s;z-index:4;display:flex;align-items:center;justify-content:center;color:#cbd2da;letter-spacing:.25em;font-size:14px}#gogs.on{opacity:1}
#setm{position:fixed;inset:0;background:rgba(0,0,0,.55);display:none;align-items:center;justify-content:center;z-index:6;backdrop-filter:blur(6px);-webkit-backdrop-filter:blur(6px)}
#setm.on{display:flex}#setm.on #setc{animation:riseIn .35s cubic-bezier(.2,.8,.2,1)}

#setc h2{margin:0 0 2px;font-size:18px}#setc label{display:flex;flex-direction:column;gap:6px;font-size:14px}#setc label b{font-weight:600;color:var(--mut)}#setc input{width:100%}
#setx{background:#fff;color:#0b0d10;font-weight:700}
.mk{position:fixed;transform:translate(-50%,-100%);display:none;pointer-events:none;color:#ff4a3d;font-weight:800;text-shadow:0 1px 3px #000;text-align:center;font-size:12px;line-height:1.1}
#wm{position:fixed;left:50%;transform:translateX(-50%);top:calc(env(safe-area-inset-top,0px) + 44px);display:none;pointer-events:none;font-weight:700;font-size:13px;text-shadow:0 1px 3px #000;background:rgba(0,0,0,.35);padding:3px 10px;border-radius:8px;white-space:nowrap}

const lam=c=>new THREE.MeshLambertMaterial({color:c});
